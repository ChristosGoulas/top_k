[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "top-k"
version = "0.1.0"
description = "Top-k query processing over NBA 2017 stats using Fagin's Threshold Algorithm"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christos Goulas" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24", "mypy>=1.10"]

[tool.setuptools]
py-modules = ["top_k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
